# Shared settings. Override per run with: urbanheat --config configs/my.yaml ...
data:
  drive_root_id: 1VH0LzmGCy1uxFmo22gBQTgkJ2fPcj9xr   # MEMBER1___PREPROCESSING (shared by link)
  raw_dir: data/raw                                  # mirror of the Drive layout (rel_dir of dataset_index.csv)
  index_file: data/raw/FINAL-DATASET/dataset_index.csv
  processed_dir: data/processed                      # harmonised dataset (docs/CONTRACTS.md section 1)
  derived_dir: data/derived                          # layers we add per pair (thermal context, ...)
  sensors: [EMIT, ENMAP, HYPERION]

ee:
  project: null                    # your Earth Engine cloud project; set it in configs/local.yaml

thermal_context:                   # median LST of OTHER Landsat dates, input of the thermal branch
  collections: [LANDSAT/LC08/C02/T1_L2, LANDSAT/LC09/C02/T1_L2]
  start: "2013-04-01"
  end: "2025-12-31"
  doy_window: 60                   # same season: +-60 days of the year around the pair's Landsat date
  exclude_days: 16                 # leave out scenes within +-16 days of that date (the target and its weather)
  max_scene_cloud: 70              # scene-level prefilter (%); pixels are masked with QA_PIXEL anyway

harmonize:
  version: 1                       # output: <processed_dir>/urbanheat_v<version>.h5
  grid_m: 60                       # common pixel size for all sensors (EMIT native); 30 m pairs are 2x2-averaged
  wl_min_nm: 420                   # candidate wavelengths; only those EVERY sensor covers are kept
  wl_max_nm: 2400
  wl_step_nm: 10
  max_gap_nm: 25                   # interpolate only between source bands at most this far apart (drops water-vapour gaps)
  min_valid_frac: 0.75             # a 60 m pixel needs >= 75 % clear 30 m pixels
  pixels_per_pair: 2000            # random valid pixels per pair in the pixel table (RF / XGBoost)

change:                            # land cover + heat per cell and year (urbanheat change)
  years: [2016, 2025]              # first and last year (Dynamic World starts mid-2015)
  cell_m: 7700                     # Member 1's cell: ~7.7 km square around the cell centre
  ring_inner_m: 1000               # rural reference ring 1-6 km outside the cell
  ring_outer_m: 6000

target:
  kind: anomaly                    # anomaly = LST - scene median (surface effect); absolute = LST in deg C

split:
  column: split                    # Member 1's split by cell; stricter alternative: block_1deg
  seed: 42

runs_dir: runs
